[package]
name = "dataplane-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "cli"
path = "bin/main.rs"

[features]
# Declared as a no-op: the image build passes --features to every package it builds, so a
# feature only some of them know about fails the build outright.
widen-handback-window = []

[dependencies]
clap = { workspace = true, features = ["derive", "std", "usage"] }
concurrency = { workspace = true }
colored = { workspace = true, features = [] }
nix = { workspace = true, features = ["socket"] }
rkyv = { workspace = true, features = ["alloc", "bytecheck", "std"] }
reedline = { workspace = true }
regex = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
rand = { workspace = true, features = ["thread_rng"] }


[build-dependencies]
# internal

# external
